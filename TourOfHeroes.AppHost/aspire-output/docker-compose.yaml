services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  sql:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    expose:
      - "1433"
    volumes:
      - type: "volume"
        target: "/var/opt/mssql"
        source: "tourofheroes.apphost-850c4bd98e-sql-data"
        read_only: false
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__HeroesDb: "Server=sql,1433;User ID=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true;Initial Catalog=HeroesDb"
      HEROESDB_HOST: "sql"
      HEROESDB_PORT: "1433"
      HEROESDB_USERNAME: "sa"
      HEROESDB_PASSWORD: "${SQL_PASSWORD}"
      HEROESDB_URI: "mssql://sa:${SQL_PASSWORD}@sql:1433/HeroesDb"
      HEROESDB_JDBCCONNECTIONSTRING: "jdbc:sqlserver://sql:1433;databaseName=HeroesDb;trustServerCertificate=true"
      HEROESDB_DATABASENAME: "HeroesDb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "${API_PORT}"
    depends_on:
      sql:
        condition: "service_started"
    networks:
      - "aspire"
  gateway:
    image: "${GATEWAY_IMAGE}"
    command:
      - "/app/yarp.dll"
    entrypoint:
      - "dotnet"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      API_HTTP: "http://api:${API_PORT}"
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/api/{**catch-all}"
      REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_api"
      REVERSEPROXY__CLUSTERS__cluster_api__DESTINATIONS__destination1__ADDRESS: "https+http://api"
      services__api__http__0: "http://api:${API_PORT}"
      API_HTTPS: "https://api:${API_PORT}"
      YARP_ENABLE_STATIC_FILES: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "gateway"
    ports:
      - "5000"
    depends_on:
      api:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  tourofheroes.apphost-850c4bd98e-sql-data:
    driver: "local"
